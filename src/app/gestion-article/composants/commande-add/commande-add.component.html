<div class="container-fluid">
    <div class="container">
       <div>
            <a class="return d-flex mt-4" [routerLink]="'/gestion-article/listCommande'">
                <span class="material-icons"> arrow_back_ios_new </span>
                <span class="ml-2"><b>Liste des Commandes</b></span>
            </a>
       </div>
       <div class="mb-4" *ngIf="selectedArticles.length > 0">
        <h5 class="mb-3 articleSelected mt-4">Articles sélectionnés</h5>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Prix unitaire (FCFA)</th>
              <th>Quantité</th>
              <th>Total (FCFA)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let article of selectedArticles">
              <td>{{ article.designation }}</td>
              <td>{{ article.prixAchatUnitaire }}</td>
              <td>
                <input type="number" min="1" [(ngModel)]="article.quantity"
                       class="form-control"
                       [ngModelOptions]="{standalone: true}"
                       (ngModelChange)="recalculerPrixTotal()" />
              </td>
              <td>{{ article.prixAchatUnitaire * (article.quantity || 1) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      
        <div class="mt-4">
            <div class="card-body">
                <div class="card">
                    <div class="card-body">
                        <form [formGroup]="commandeForm" (ngSubmit)="onSubmit()">
                        
            
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date de la commande</label>
                                <input type="date" class="form-control" placeholder="Entrer la date de la commande "
                                    name="date" formControlName="date" />
                            </div>
                            
                                
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Prix Total</label>
                                <input type="number" class="form-control" placeholder="Entrer le prix total de la commande" name="prixTotal" formControlName="prixTotal" />

                            </div>

                          
                              
                            <div class="d-flex justify-content-center">

                                <input type="submit" class="btn btn-outline-secondary" [disabled]=""
                                    value="Enregistrer" />
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
