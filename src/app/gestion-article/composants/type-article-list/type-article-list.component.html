<div class="container-fluid">
  <div class="mt-4">
    <a class="add style-button d-flex" [routerLink]="'/gestion-article/addTypeArticle'">
      <span class="material-icons">
        {{ "add" }}
      </span>
      <span class="ml-2 style-text"> Nouvel Type D'Article</span>
    </a>
    <h4 class="justify-content-left text-left">
      Types Articles
    </h4>
  </div>

  <!--TABLES-->
  <div class="container-fluid content-table">
    <h2 class="text-center mt-4 text-dispo" *ngIf="!typeArticles || typeArticles.length <= 0">
      Pas d'unité de mesure Disponible!!!
    </h2>
    <div class="mt-4">
      <table class="table table-hover mt-4">
        <thead>
          <tr style="text-align: center" class="style-text-table">
            <th scope="col">ID</th>
            <th scope="col">Designation</th>
            <th scope="col">Description</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody style="text-align: center">
          <tr *ngFor="let typeArticle of typeArticles">
            <th style="text-align: center" scope="row">
              {{ typeArticles.indexOf(typeArticle) + 1 }}
            </th>
            <td>{{ typeArticle.designation}}</td>
            <td>{{ typeArticle.description }}</td>
            <td>
              <div class="d-flex">
            <td style="margin-left: 180px">
              <a class="nav-link m-nav-link" (click)="change(typeArticle?.id)">
                <span class="material-icons">mode_edit</span>
              </a>
            </td>
            <td style="margin-left: 20px">
              <a class="nav-link m-nav-link" (click)="deleteTypeArticle(typeArticle?.id)">
                <span class="material-icons">delete</span>
              </a>
            </td>
          </div>
    </td>
    <td></td>
    </tr>
    </tbody>
    </table>
