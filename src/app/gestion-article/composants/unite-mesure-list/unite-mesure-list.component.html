<div class="container-fluid mt-4">
  <!-- En-tête avec bouton d'ajout d'unité de mesure -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold" style="color: #2D3D5E;">Unité de Mesure</h4>
    <a class="btn rounded-pill d-flex align-items-center" style="background-color: #996F05; color: white;" [routerLink]="'/gestion-article/addUniteMesure'">
      <span class="material-icons me-2">add_circle_outline</span> Nouvelle Unité de Mesure
    </a>
  </div>

  <!-- Message si aucune unité de mesure n'est disponible -->
  <h2 class="text-center text-dispo" *ngIf="!uniteMesures || uniteMesures.length <= 0">
    Pas d'unité de mesure disponible !!!
  </h2>

  <!-- Liste des unités de mesure -->
  <div *ngIf="uniteMesures && uniteMesures.length > 0" class="card border-0 shadow-sm rounded-4" style="background-color: #ffffff; color: #2D3D5E;">
    <div class="card-body p-4">

      <!-- Titre de la section des unités de mesure -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0" style="color: #2D3D5E;">📋 Liste des Unités de Mesure</h5>
      </div>

      <!-- Table des unités de mesure -->
      <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
          <thead style="background-color: #2D3D5E; color: white;">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Nom</th>
              <th scope="col">Abbréviation</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let uniteMesure of uniteMesures; let i = index">
              <td><strong>{{ i + 1 }}</strong></td>
              <td>{{ uniteMesure.nom }}</td>
              <td>{{ uniteMesure.abreviation }}</td>
              <td>
                <div class="d-flex justify-content-center gap-2">
                  <button type="button"
                          class="btn btn-sm"
                          style="background-color: #2D3D5E; color: white;"
                          (click)="change(uniteMesure?.id)"
                          data-bs-toggle="tooltip"
                          data-bs-placement="top"
                          title="Modifier cette unité">
                    <span class="material-icons">edit</span>
                  </button>
                  <button type="button"
                          class="btn btn-sm"
                          style="background-color: #996F05; color: white;"
                          (click)="deleteUniteMesure(uniteMesure?.id)"
                          data-bs-toggle="tooltip"
                          data-bs-placement="top"
                          title="Supprimer cette unité">
                    <span class="material-icons">delete</span>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Pagination -->
  <div class="row mt-4 align-items-center justify-content-between">
    <!-- Pagination boutons -->
    <div class="col-lg-6 col-md-6 col-sm-12 d-flex justify-content-center justify-content-md-start">
      <nav aria-label="Navigation des pages">
        <ul class="pagination mb-0">
          <li class="page-item" [class.disabled]="disablePrevious || totalPage === 1">
            <button class="page-link" (click)="precedent()" [disabled]="disablePrevious || totalPage === 1">
              <i class="bi bi-arrow-left-circle"></i> Précédent
            </button>
          </li>
          <li class="page-item ms-2" [class.disabled]="disableNext || totalPage === 1">
            <button class="page-link" (click)="suivant()" [disabled]="disableNext || totalPage === 1">
              Suivant <i class="bi bi-arrow-right-circle"></i>
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Sélecteur nombre d’éléments par page -->
    <div class="col-lg-3 col-md-4 col-sm-12 d-flex justify-content-center justify-content-md-end mt-3 mt-md-0">
      <div class="input-group" style="max-width: 200px;">
        <label class="input-group-text" for="pageSize">Afficher</label>
        <select id="pageSize" class="form-select" (change)="onSelectedPageSize($event)">
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>
    </div>
  </div>
</div>
