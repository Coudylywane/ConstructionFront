<div class="container py-4">
    <div class="row g-4">
      <!-- Stat Cards -->
      <div class="col-md-4" *ngFor="let stat of stats">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body d-flex align-items-center">
            <div class="me-3">
              <span class="material-icons fs-1 text-primary">{{ stat.icon }}</span>
            </div>
            <div>
              <h6 class="mb-0 text-muted">{{ stat.title }}</h6>
              <h4 class="fw-bold">{{ stat.value }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Filters -->
    <div class="row mt-5">
      <div class="col-md-6">
        <label for="filterDate" class="form-label">Filtrer par date</label>
        <input type="date" class="form-control" id="filterDate" [(ngModel)]="filter.date">
      </div>
      <div class="col-md-6">
        <label for="filterStatus" class="form-label">Filtrer par statut</label>
        <select class="form-select" id="filterStatus" [(ngModel)]="filter.status">
          <option value="">Tous</option>
          <option *ngFor="let s of statusList" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>
  
    <!-- Table or Content Preview -->
    <div class="row mt-5">
      <div class="col-12">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Récapitulatif</h5>
            <button class="btn btn-outline-primary btn-sm">
              <span class="material-icons align-middle">refresh</span>
              Actualiser
            </button>
          </div>
          <div class="card-body">
            <!-- Ajoute ici ta logique d'affichage selon le filtre ou autres 
            <p *ngIf="!filteredData.length">Aucune donnée disponible</p>
            <ul *ngIf="filteredData.length">
              <li *ngFor="let item of filteredData">{{ item }}</li>
            </ul>-->
          </div>
        </div>
      </div>
    </div>
  </div>
