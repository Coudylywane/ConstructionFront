<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed" style="background-color: #F9F9F9; min-height: 100vh;">
  

  <!-- Main Content Start -->
  <div class="body-wrapper mt-4">
    <header class="app-header"></header>

    <!-- Retour à la Liste des Types d'Articles -->
    <div class="container-fluid p-4">
      <div class="mb-4">
        <a class="btn d-flex align-items-center" [routerLink]="'/gestion-article/listTypeArticle'"
          style="background-color: #2D3D5E; color: white; border-radius: 50px; padding: 8px 16px;">
          <span class="material-icons">arrow_back_ios_new</span>
          <span class="ms-2"><b>Retour à la Liste</b></span>
        </a>
      </div>

      <!-- Formulaire pour ajouter un type d'article -->
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h3 class="fw-bold mb-4" style="color: #2D3D5E;">Nouvelle Type d'Article</h3>

          <form [formGroup]="typeFrom" (ngSubmit)="addOrUpdateType()">
            <div class="row g-3">
              <div class="col-12">
                <label for="designation" class="form-label fw-semibold" style="color: #2D3D5E;">Désignation</label>
                <input type="text" id="designation" class="form-control rounded-3" placeholder="Entrer la désignation"
                  formControlName="designation" />
                <div *ngIf="validDesignation()" class="text-danger mt-1">
                  Veuillez remplir ce champ
                </div>
              </div>

              <div class="col-12">
                <label for="description" class="form-label fw-semibold" style="color: #2D3D5E;">Description</label>
                <input type="text" id="description" class="form-control rounded-3" placeholder="Entrer la description"
                  formControlName="description" />
                <div *ngIf="validDescription()" class="text-danger mt-1">
                  Veuillez remplir ce champ
                </div>
              </div>

              <div class="col-12 d-flex justify-content-center mt-4">
                <button type="submit" class="btn rounded-pill px-5 py-2" 
                        [disabled]="!typeFrom.valid"
                        style="background-color: #996F05; color: white; font-weight: bold;">
                    {{ isEditing ? 'Modifier' : 'Enregistrer' }}
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
