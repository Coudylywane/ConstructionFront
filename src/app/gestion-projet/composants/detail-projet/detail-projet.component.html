<p-toast></p-toast>

<!-- Bouton de retour -->
<a class="return d-flex" [routerLink]="'/gestion-projet/listProjet'">
  <span class="material-icons"> arrow_back_ios_new </span>
  <span class="ml-2"><b>Liste des Projets</b></span>
</a>

<!-- En-tête de la page -->
<div class="page-header">
  <h1>Détails du Projet</h1>
  <div  class="actions" *ngIf="projet?.status === 'ENATENTE'">
    <button *appHasAnyAuthority="['CLIENT']"
      (click)="validateProject('REFUSER')"
      pButton
      pRipple
      icon="pi pi-times-circle"
      class="btn btn-danger"
      label="Rejeter le projet"
    ></button>
    <button  *appHasAnyAuthority="['CLIENT']"
      (click)="validateProject('VALIDATED')"
      pButton
      pRipple
      icon="pi pi-save"
      class="btn btn-success"
      label="Valider le projet"
    ></button>
  </div>
</div>


<!-- Bannière du projet -->
<div class="project-banner mb-4">
  <h2>Projet {{ projet?.id }}</h2>
</div>

<!-- Onglets pour les différentes sections -->
<p-tabView [scrollable]="true">
  <!-- Onglet des informations principales -->
  <div class="grid">
    <!-- Description du projet -->
    <div class="col-12">
      <div class="field">
        <label for="description">Description</label>
        <textarea
          id="description"
          [value]="projet?.description"
          [disabled]="true"
          pInputTextarea
          class="full-width"
        >
        </textarea>
      </div>
    </div>

    <!-- Date de début -->
    <div class="col-12 md:col-6 lg:col-4">
      <div class="field">
        <label for="startDate">Date de début</label>
        <input
          type="text"
          id="startDate"
          [value]="projet?.startDate | date : 'dd/MM/yyyy'"
          [disabled]="true"
          pInputText
          class="full-width"
        />
      </div>
    </div>

    <!-- Date de fin prévisionnelle -->
    <div class="col-12 md:col-6 lg:col-4">
      <div class="field">
        <label for="endDateProvisioning">Date de fin prévisionnelle</label>
        <input
          type="text"
          id="endDateProvisioning"
          [value]="projet?.endDateProvisioning | date : 'dd/MM/yyyy'"
          [disabled]="true"
          pInputText
          class="full-width"
        />
      </div>
    </div>

    <!-- Date de fin -->
    <div class="col-12 md:col-6 lg:col-4">
      <div class="field">
        <label for="endDate">Date de fin</label>
        <input
          type="text"
          id="endDate"
          [value]="projet?.endDate | date : 'dd/MM/yyyy'"
          [disabled]="true"
          pInputText
          class="full-width"
        />
      </div>
    </div>
  </div>
