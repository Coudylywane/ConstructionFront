<div class="modal-header">
    <h5 class="modal-title">Modifier la tâche: {{ tache?.nom }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
    <div class="form-group">
        <label>Pourcentage d'exécution (%)</label>
        <input type="number" class="form-control" [(ngModel)]="pourcentageExecution" min="0" max="100">
    </div>
    <div class="form-group">
        <label>Articles utilisés</label>
        <div *ngFor="let article of articles" class="input-group mb-2">
            <input type="number" class="form-control" [value]="getArticleQuantity(article.id)"
                   (input)="updateArticleQuantity(article.id, $event)" min="0" placeholder="Quantité">
            <div class="input-group-append">
                <span class="input-group-text">{{ article.nom }}</span>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss('Cancel click')">Annuler</button>
    <button type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
</div>
