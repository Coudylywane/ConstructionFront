<div
  class="page-wrapper"
  id="main-wrapper"
  data-layout="vertical"
  data-navbarbg="skin6"
  data-sidebartype="full"
  data-sidebar-position="fixed"
  data-header-position="fixed"
>
 
  <div class="body-wrapperb mt-4">
    <header class="app-header"></header>
    <!-- Bouton retour -->
    <div class="mb-4">
      <a class="btn d-flex align-items-center" [routerLink]="'/gestion-projet/listProjet'"
        style="background-color: #2D3D5E; color: white; border-radius: 50px; padding: 8px 16px;">
        <span class="material-icons">arrow_back_ios_new</span>
        <span class="ms-2"><b>Retour à la Liste</b></span>
      </a>
    </div>

    <div class="container-fluid">
      <div class="card shadow-sm border-0 rounded-4">
       
        <div class="card-body p-4 mt-4">
          <h3 class="fw-bold mb-4" style="color: #2D3D5E;"> Nouveau Projet</h3>

          <div class="card">
            <div class="card-body">
              <form [formGroup]="projetForm">
                <div class="mb-3">
                  <label for="name" class="form-label">Nom du projet</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Entrer le nom du projet"
                    formControlName="name"
                  />
                  <!-- <<div *ngIf="projectForm.get('name').invalid && projectForm.get('name').touched" class="text-danger">
                      Veuillez remplir ce champ
                    </div> -->
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label"
                    >Description</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Entrer la description"
                    formControlName="description"
                  />
                  <!-- <div *ngIf="projectForm.get('description').invalid && projectForm.get('description').touched" class="text-danger">
                      Veuillez remplir ce champ
                    </div> -->
                </div>

                <div class="mb-3">
                  <label for="startDate" class="form-label"
                    >Date de début</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    formControlName="startDate"
                  />
                  <!-- <div *ngIf="projectForm.get('startDate').invalid && projectForm.get('startDate').touched" class="text-danger">
                      Veuillez remplir ce champ
                    </div> -->
                </div>
                <div class="row">
                  <div class="mb-3 col-md-6">
                  <label for="endDateProvisioning" class="form-label"
                    >Date de fin prévisionnelle</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    formControlName="endDateProvisioning"
                  />
                  <!-- <div *ngIf="projectForm.get('endDateProvisioning').invalid && projectForm.get('endDateProvisioning').touched" class="text-danger">
                      Veuillez remplir ce champ
                    </div> -->
                  </div>
                  <div class="mb-3 col-md-6">
                  <label for="endDate" class="form-label">Date de fin</label>
                  <input
                    type="date"
                    class="form-control"
                    formControlName="endDate"
                  />
                  <!-- <div *ngIf="projectForm.get('endDate').invalid && projectForm.get('endDate').touched" class="text-danger">
                      Veuillez remplir ce champ
                    </div> -->
                </div>

                </div>
               

               
                <div class="col-md-6">
                <label for="clientId" class="form-label">Client *</label>
                <p-dropdown
                  id="clientId"
                  [options]="users"
                  formControlName="clientId"
                  optionLabel="nom"
                  optionValue="id"
                  placeholder="Sélectionnez un client"
                  [ngClass]="{'is-invalid': projetForm.get('clientId')?.touched && projetForm.get('clientId')?.invalid}"
                >
              </p-dropdown>
                <div *ngIf="projetForm.get('clientId')?.touched && projetForm.get('clientId')?.invalid" class="invalid-feedback">
                  Le client est obligatoire.
                </div>
              </div>

                <div class="bt-boutton d-flex justify-content-center">
                  <button
                    (click)="createProject()"
                    [disabled]="!projetForm.valid"
                    class="btn btn-outline-secondary">
                    Enregistrer
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<p-confirmDialog
  [style]="{ width: '50vw', backgroundColor: '#c0a664f9', color: 'white' , padding: '20px'}"
  icon="pi pi-check-circle"
  [baseZIndex]="10000"
>
</p-confirmDialog>
