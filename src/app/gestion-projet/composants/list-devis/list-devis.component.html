<div class="container-fluid">
  <div class="mt-4">
    <h4 class="section-title">Liste des devis</h4>
  </div>

  <div class="container-fluid content-table">
    <!-- Afficher le message d'erreur -->
    <div *ngIf="errorMessage" class="alert alert-danger text-center mt-4">
      {{ errorMessage }}
    </div>

    <!-- Message si aucun devis -->
    <h2 *ngIf="devisList.length === 0 && !errorMessage" class="text-center text-dispo mt-4">
      Pas de devis disponible !
    </h2>

    <!-- Tableau des devis -->
    <div *ngIf="devisList.length > 0" class="mt-4">
      <div class="table-container">
        <table class="styled-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Date de création</th>
              <th scope="col">Statut</th>
              <th scope="col">Projet ID</th>
              <th scope="col">Client ID</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let devis of devisList">
              <td>{{ devis.id }}</td>
              <td>{{ devis.dateCreation | date : 'dd-MM-yyyy' }}</td>
              <td>
                <span class="status-badge" [ngClass]="getStatusClass(devis.statut)">
                  {{ devis.statut | statut }}
                </span>
              </td>
              <td>{{ devis.projet.id }}</td>
              <td>{{ devis.projet.clientId }}</td>
              <td>
                <div class="actions">
                  <ng-container *ngIf="devis.statut === 'VALIDER'">
                    <!-- Bouton Visualiser si planning existe -->
                    <button
                      *ngIf="devis.planningId"
                      class="btn btn-primary btn-sm"
                      [routerLink]="['/gestion-projet/visualiserPlanning', devis.id]"
                      title="Visualiser le planning"
                    >
                      <i class="pi pi-eye"></i> Visualiser
                    </button>
                    <!-- Bouton Générer Planning si aucun planning -->
                    <button
                      *ngIf="!devis.planningId"
                      class="btn btn-success btn-sm"
                      [routerLink]="['/gestion-projet/genererPlanning', devis.id]"
                      title="Générer un planning"
                    >
                      <i class="pi pi-calendar"></i> Générer Planning
                    </button>
                  </ng-container>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
