<div class="container-fluid">
  <div class="mt-4">
    <h4 class="section-title">Liste des devis</h4>
  </div>

  <div class="container-fluid content-table">
    <h2 *ngIf="devisList.length === 0" class="text-center text-dispo mt-4">
      Pas de devis disponible !
    </h2>

    <div *ngIf="devisList.length > 0" class="mt-4">
      <div class="table-container">
        <table class="styled-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Date de création</th>
              <th scope="col">Statut</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let devis of devisList">
              <td>{{ devis.id }}</td>
              <td>{{ devis.dateCreation | date : 'dd-MM-yyyy' }}</td>
              <td>
                <span class="status-badge" [ngClass]="getStatusClass(devis.statut)">
                  {{ devis.statut | statut }}
                </span>
              </td>
              <td>
                <div class="actions">
                  <ng-container *ngIf="devis.statut === 'VALIDER'">
                    <!-- Bouton Visualiser si planning existe -->
                    <button
                      *ngIf="devis.planningId"
                      class="btn btn-primary btn-sm"
                      [routerLink]="['/gestion-projet/visualiserPlanning', devis.id]"
                      title="Visualiser le planning"
                    >
                      <i class="pi pi-eye"></i> Visualiser
                    </button>
                    <!-- Bouton Générer Planning si aucun planning -->
                    <button
                      *ngIf="!devis.planningId"
                      class="btn btn-success btn-sm"
                      [routerLink]="['/gestion-projet/genererPlanning', devis.id]"
                      title="Générer un planning"
                    >
                      <i class="pi pi-calendar"></i> Générer Planning
                    </button>
                  </ng-container>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
  </div>

  <!--PAGINATION-->

  <div class="row mt-4 align-items-center justify-content-between">
    <!-- Pagination boutons -->
    <div class="col-lg-6 col-md-6 col-sm-12 d-flex justify-content-center justify-content-md-start">
      <nav aria-label="Navigation des pages">
        <ul class="pagination mb-0">
          <li class="page-item" [class.disabled]="disablePrevious || totalPage === 1">
            <button class="page-link" (click)="precedent()" [disabled]="disablePrevious || totalPage === 1">
               Précédent
            </button>
          </li>
          <li class="page-item ms-2" [class.disabled]="disableNext || totalPage === 1">
            <button class="page-link" (click)="suivant()" [disabled]="disableNext || totalPage === 1">
              Suivant 
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Sélecteur nombre d’éléments -->
    <div class="col-lg-3 col-md-4 col-sm-12 d-flex justify-content-center justify-content-md-end mt-3 mt-md-0">
      <div class="input-group" style="max-width: 200px;">
        <label class="input-group-text" for="pageSize">Afficher</label>
        <select
          id="pageSize"
          class="form-select"
          (change)="onSelectedPageSize($event)"
        >
          <option value="2">2</option>
          <option value="5"selected>4</option>
          <option value="10" >10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>
    </div>
  </div>
</div>
