<div class="container-fluid">
    <!-- Button to add a new task -->
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
      <h4 class="fw-bold" style="color: #2D3D5E;">Tâches</h4>
      <a class="btn rounded-pill d-flex align-items-center" style="background-color: #996F05; color: white;" [routerLink]="'/gestion-projet/addTache'">
        <span class="material-icons me-2">add_circle_outline</span> Nouvelle Tâche
      </a>
    </div>

 

  <!-- Table Section -->
  <div class="container-fluid content-table">
    <h2 *ngIf="taches.length === 0" class="text-center text-dispo mt-4">
      Pas de tâches disponibles !!!
    </h2>

    <!-- Tasks Table -->
    <div *ngIf="taches.length > 0" class="mt-4">
      <table class="styled-table">
        <thead>
          <tr>
            <th scope="col">#ID</th>
            <th scope="col">Nom</th>
            <th scope="col">Durée estimée (jours)</th>
            
          </tr>
        </thead>
        <tbody>
          <!-- Dynamically generate rows for each task -->
          <tr *ngFor="let tache of taches">
            <th scope="row">{{ tache.id }}</th>
            <td>{{ tache.nom }}</td>
            <td>{{ tache.dureeEstimee }}</td>
           <!-- <td>
              <span class="status-badge" [ngClass]="getStatusClass(tache.status)">
                {{ tache.status | tacheStatus }}
              </span>
            </td> 
            <td>
              <div class="d-flex justify-content-center gap-2">
                <button
                  pButton
                  pRipple
                  type="button"
                  icon="pi pi-pencil"
                  class="p-button-primary p-button-sm"
                  [routerLink]="['/gestion-projet/editTache', tache.id]"
                  title="Modifier la tâche"
                ></button>
                
              </div>
            </td>-->
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
