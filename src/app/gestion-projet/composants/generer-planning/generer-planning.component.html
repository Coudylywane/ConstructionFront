<div class="container mt-4">
  <h2>Générer le planning pour le devis #{{ devisId }}</h2>

  <table class="table table-hover">
    <thead>
      <tr>
        <th>Sélectionner</th>
        <th>Nom de la tâche</th>
        <th>Date de début</th>
        <th>Date de fin</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tache of taches">
        <td>
          <input
            type="checkbox"
            [(ngModel)]="tache.selected"
            (change)="onTacheSelectionChange(tache)"
          />
        </td>
        <td>{{ tache.nom }}</td>
        <td>
          <input
            type="date"
            [(ngModel)]="tache.dateDebut"
            [disabled]="!tache.selected"
          />
        </td>
        <td>
          <input
            type="date"
            [(ngModel)]="tache.dateFin"
            [disabled]="!tache.selected"
          />
        </td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-primary" (click)="genererPlanning()">
    Générer le planning
  </button>
</div>
