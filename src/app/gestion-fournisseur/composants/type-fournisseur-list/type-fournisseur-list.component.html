<div class="container-fluid mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold" style="color: #2D3D5E;">Type Fournisseur</h4>
    <a class="btn rounded-pill d-flex align-items-center" style="background-color: #996F05; color: white;" [routerLink]="'/gestion-fournisseur/addTypeFournisseur'">
      <span class="material-icons me-2">add_circle_outline</span> Nouveau Type Fournisseur
    </a>
  </div>

  <h2 class="text-center text-dispo" *ngIf="!typeFournisseurs || typeFournisseurs.length <= 0">
    Pas Type de Fournisseur Disponible!!!
  </h2>

  <!--TABLES-->
  <div *ngIf="typeFournisseurs && typeFournisseurs.length > 0" class="card border-0 shadow-sm rounded-4" style="background-color: #ffffff; color: #2D3D5E;">
  
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-center mb-3 ">
        <h5 class="fw-bold mb-0" style="color: #2D3D5E;">📋 Liste des Types de fournisseur</h5>
      </div>
      <div class="table-responsive mt-4">
        <table class="table table-hover align-middle text-center">
          <thead style="background-color: #2D3D5E; color: white;">
            <tr>
              <th scope="col">#ID</th>
              <th scope="col">Designation</th>
              <th scope="col">Description</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody style="text-align: center">
            <tr *ngFor="let typeFournisseur of typeFournisseurs">
              <th style="text-align: center" scope="row">
                {{ typeFournisseurs.indexOf(typeFournisseur) + 1 }}
              </th>
              <td>{{ typeFournisseur.designation}}</td>
              <td>{{ typeFournisseur.description }}</td>
              <td>
                <div class="d-flex justify-content-center gap-2">
                  <button type="button"
                          class="btn btn-sm"
                          style="background-color: #2D3D5E; color: white;"
                          (click)="change(typeFournisseur.id)" 
                          data-bs-toggle="tooltip"
                          data-bs-placement="top"
                          title="Modifier cette zone">
                    <span class="material-icons">edit</span>
                  </button>
                  <button type="button"
                          class="btn btn-sm"
                          style="background-color: #996F05; color: white;"
                          (click)="deleteTypeFournisseur(typeFournisseur?.id)" 
                          data-bs-toggle="tooltip"
                          data-bs-placement="top"
                          title="Supprimer cette zone">
                    <span class="material-icons">delete</span>
                  </button>
                </div>

              </td>
              
            
            </tr>
          </tbody>
        </table>
      </div>

      <!--PAGINATION-->

      <div class="row mt-4 align-items-center justify-content-between">
      <!-- Pagination boutons -->
      <div class="col-lg-6 col-md-6 col-sm-12 d-flex justify-content-center justify-content-md-start">
        <nav aria-label="Navigation des pages">
          <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="disablePrevious || totalPage === 1">
              <button class="page-link" (click)="precedent()" [disabled]="disablePrevious || totalPage === 1">
                Précédent
              </button>
            </li>
            <li class="page-item ms-2" [class.disabled]="disableNext || totalPage === 1">
              <button class="page-link" (click)="suivant()" [disabled]="disableNext || totalPage === 1">
                Suivant 
              </button>
            </li>
          </ul>
        </nav>
      </div>
    
      <!-- Sélecteur nombre d’éléments -->
      <div class="col-lg-3 col-md-4 col-sm-12 d-flex justify-content-center justify-content-md-end mt-3 mt-md-0">
        <div class="input-group" style="max-width: 200px;">
          <label class="input-group-text" for="pageSize">Afficher</label>
          <select
            id="pageSize"
            class="form-select"
            (change)="onSelectedPageSize($event)"
          >
            <option value="2">2</option>
            <option value="5"selected>4</option>
            <option value="10" >10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </div>
      </div>
      </div>
      <!---->
    </div>
  </div>
</div>
