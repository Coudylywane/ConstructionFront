<div class="container-fluid">
  <div class="mt-4">
    <a class="add style-button d-flex" [routerLink]="'/gestion-fournisseur/addTypeFournisseur'">
      <span class="material-icons">
        {{ "add" }}
      </span>
      <span class="ml-2 style-text"> Nouveau Type Fournisseur</span>
    </a>
    <h4 class="justify-content-left text-left ">
      Types de Fournisseurs
    </h4>
  </div>
<!--TABLES-->
  <div class="container-fluid content-table">
    <h2 class="text-center text-dispo mt-4" *ngIf="!typeFournisseurs || typeFournisseurs.length <= 0">
      Pas d'unite de mesure Disponible!!!
    </h2>
    <div class="mt-4">
      <table class="table table-hover">
        <thead>
          <tr style="text-align: center" class="style-text-table">
            <th scope="col">ID</th>
            <th scope="col">Designation</th>
            <th scope="col">Description</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody style="text-align: center">
          <tr *ngFor="let typeFournisseur of typeFournisseurs">
            <th style="text-align: center" scope="row">
              {{ typeFournisseurs.indexOf(typeFournisseur) + 1 }}
            </th>
            <td>{{ typeFournisseur.designation}}</td>
            <td>{{ typeFournisseur.description }}</td>
            <td>
              <div class="d-flex">
                <td style="margin-left: 180px">
                 <a
                    class="nav-link m-nav-link"
                    (click)="change(typeFournisseur.id)">
                    <span class="material-icons">mode_edit</span>
                  </a> 
                </td>
                <td style="margin-left: 20px">
                <a
                    class="nav-link m-nav-link"
                    (click)="deleteTypeFournisseur(typeFournisseur?.id)"
                   >
                    <span class="material-icons">delete</span>
                  </a>  
                </td>
              </div>
            </td>
            <td></td>
         
          </tr>
        </tbody>
      </table>
