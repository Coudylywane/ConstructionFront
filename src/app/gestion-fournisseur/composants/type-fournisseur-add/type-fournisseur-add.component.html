
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
  data-sidebar-position="fixed" data-header-position="fixed">
  
  <div class="body-wrapper">
      
    <div class="container-fluid p-4">
      <!-- Bouton retour -->
      <div class="mb-4">
        <a class="btn d-flex align-items-center" [routerLink]="'/gestion-fournisseur/listTypeFournisseur'"
        style="background-color: #2D3D5E; color: white; border-radius: 50px; padding: 8px 16px;">
          <span class="material-icons"> arrow_back_ios_new </span>
          <span class="ml-2"><b>Retour à la Liste</b></span>
        </a>
     </div>
    <!-- Formulaire -->
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">   
        <div class="card-body p-4">
          <h3 class="fw-bold mb-4" style="color: #2D3D5E;"> Nouveau Type de Fournisseur</h3>              
                  <form [formGroup]="typeFourniFrom" (ngSubmit)="addTypeFournisseur()">
                    <div class="mb-3">
                      <label for="exampleInputEmail1" class="form-label">Designation</label>
                      <input type="text" class="form-control" placeholder="Entrer Designation " name="designation"
                        formControlName="designation" />
                      <div *ngIf="validDesignation()" class="text-danger">
                        veuillez remplir ce champ
                      </div>

                    </div>
                    <div class="mb-3">
                      <label for="exampleInputPassword1" class="form-label">Description</label>
                      <input type="text" class="form-control" placeholder="Entrer Description " name="description"
                        formControlName="description" />
                      <div *ngIf="validDescription()" class="text-danger">
                        veuillez remplir ce champ
                      </div>
                    </div>
                    <div class="d-flex justify-content-center">
                      <input type="submit" class="btn btn-outline-secondary" [disabled]="!typeFourniFrom.valid" value="Enregistrer" />
                    </div>
                  </form>
         
              </div>
      </div>
    </div>
  </div>
      
  </div>
</div>
