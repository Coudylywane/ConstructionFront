            <form [formGroup]="form" (submit)="login()">
              <span style="color: darkred">
                {{ err }}
              </span>
              <div class="d-flex flex-row align-items-center justify-content-center">
                <h3 class=" text-center fw-bold mb-0 me-3">Connexion</h3>
                
              </div>
    
              <div class="divider d-flex align-items-center my-4">
                <span class="text-center  mx-3 mb-0">Informations</span>
              </div>
    
              <!-- Email input -->
              <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="form3Example3">Email</label>
                <input type="text" formControlName="login" id="form3Example3" class="form-control form-control-lg"
                  placeholder="Email@gmail.com" />
              </div>
    
              <!-- mot de passe input -->
              <div data-mdb-input-init class="form-outline mb-3">
                <label class="form-label" for="form3Example4">Mot de passe</label>
                <input type="password" id="form3Example4" formControlName="password" class="form-control form-control-lg"
                  placeholder="*********" />
              </div>
    
              <div class="d-flex justify-content-between align-items-center">
                <!-- Checkbox 
                <div class="form-check mb-0">
                  <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3" />
                  <label class="form-check-label" for="form2Example3">
                    Remember me
                  </label>
                </div>
                <a href="#!" class="text-body">Forgot password?</a>-->
              </div>
    
              <div class="text-center text-lg-start mt-4 pt-2">
                <button  type="button"  [disabled]="!form.valid" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg"
                  style="padding-left: 2.5rem; padding-right: 2.5rem;">Se connecter</button>
                <p class="small fw-bold mt-4 pt-1 mb-0">Avez-vous déjà un compte ? <a [routerLink]="'/admin/ajoutUser'" href="#"
                    class="link-dangers">Inscription</a></p>
              </div>
    
            </form>
