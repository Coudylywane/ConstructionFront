<div class="container">
    <a class="return d-flex mt-4" [routerLink]="'/gestion-utilisateur/listUtilisateur'">
      <span class="material-icons">arrow_back_ios_new</span>
      <span class="ml-2"><b>Liste des utilisateurs</b></span>
    </a>

    <div class="mt-4">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="utilisateurForm" (ngSubmit)="addUtilisateur()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nom</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Entrer le nom"
                  formControlName="nom"
                />
                <div *ngIf="validNom()" class="text-danger">Veuillez renseigner le nom</div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Prénom</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Entrer le prénom"
                  formControlName="prenom"
                />
                <div *ngIf="validPrenom()" class="text-danger">Veuillez renseigner le prénom</div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Entrer l'adresse email"
                  formControlName="login"
                />
                <div *ngIf="validEmail()" class="text-danger">Veuillez renseigner un email valide</div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Mot de passe</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Entrer le mot de passe"
                  formControlName="password"
                />
                <div *ngIf="validPassword()" class="text-danger">Veuillez renseigner un mot de passe</div>
              </div>
            </div>

            <!-- CHAMP TÉLÉPHONE AJOUTÉ -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Téléphone</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Ex: 771234567 ou +221771234567"
                  formControlName="telephoneString"
                />
                <div *ngIf="validTelephone()" class="text-danger">
                  Veuillez entrer un numéro de téléphone valide
                </div>
              </div>
            </div>

            <div class="mb-3" *ngIf="roles.length > 0">
              <label class="form-label">Rôle</label>
              <select  class="form-select" formControlName="role">
                <option value="0" disabled selected>Choisir un rôle</option>
                <option *ngFor="let role of roles"  [value]="role.id">{{ role.libelle }}</option>
              </select>
              <div *ngIf="validRole()" class="text-danger">Veuillez sélectionner un rôle</div>
            </div>

            <div class="d-flex justify-content-center">
              <input
                type="submit"
                class="btn btn-outline-secondary"
                value="Enregistrer"
              />
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
