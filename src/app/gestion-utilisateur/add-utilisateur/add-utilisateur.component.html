<div class="container">

  <!-- Bouton retour -->
  <div class="mb-4 mt-4">
    <a class="btn d-flex align-items-center" [routerLink]="'/gestion-utilisateur/liste-user'"
      style="background-color: #2D3D5E; color: white; border-radius: 50px; padding: 8px 16px;">
      <span class="material-icons">arrow_back_ios_new</span>
      <span class="ms-2"><b>Retour à la Liste</b></span>
    </a>
  </div>

  <div class="card shadow-sm border-0 rounded-4">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-4" style="color: #2D3D5E;"> Nouveau Utilisateur </h3>

        <form [formGroup]="utilisateurForm" (ngSubmit)="addUtilisateur()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Nom</label>
              <input type="text" class="form-control" placeholder="Entrer le nom" formControlName="nom" />
              <div *ngIf="validNom()" class="text-danger">Veuillez renseigner le nom</div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Prénom</label>
              <input type="text" class="form-control" placeholder="Entrer le prénom" formControlName="prenom" />
              <div *ngIf="validPrenom()" class="text-danger">Veuillez renseigner le prénom</div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Entrer l'adresse email" formControlName="login" />
              <div *ngIf="validEmail()" class="text-danger">Veuillez renseigner un email valide</div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Mot de passe</label>
              <input type="password" class="form-control" placeholder="Entrer le mot de passe" formControlName="password" />
              <div *ngIf="validPassword()" class="text-danger">Veuillez renseigner un mot de passe</div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Téléphone</label>
              <input type="text" class="form-control" placeholder="Ex: 771234567 ou +221771234567"
                formControlName="telephoneString" />
              <div *ngIf="validTelephone()" class="text-danger">Veuillez entrer un numéro de téléphone valide</div>
            </div>

            <div class="col-md-6">
              <div class="mb-3" *ngIf="roles.length > 0">
                <label class="form-label">Rôle</label>
                <select class="form-select" formControlName="role">
                  <option value="0" disabled selected>Choisir un rôle</option>
                  <option *ngFor="let role of roles" [value]="role.id">{{ role.libelle }}</option>
                </select>
                <div *ngIf="validRole()" class="text-danger">Veuillez sélectionner un rôle</div>
              </div>
            </div>
          </div>

          

          <!-- ✅ Avatar -->
          <div class="row align-items-center">
            <div class="col-md-6 mb-3">
              <label class="form-label">Avatar</label>
              <input type="file" class="form-control" (change)="onAvatarChange($event)" accept="image/*" />
            </div>
            <div class="col-md-6 mb-3 text-center" *ngIf="avatarPreview">
              <img [src]="avatarPreview" alt="Aperçu avatar" class="rounded-circle shadow" width="100" height="100" />
              <p class="text-muted mt-2">Aperçu de l'image</p>
            </div>
          </div>

          <div class="d-flex justify-content-center">
            <input type="submit" class="btn" [style.backgroundColor]="'#996F05'" style="color: white;"
              value="Enregistrer" />
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
